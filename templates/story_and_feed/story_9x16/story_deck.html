<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موتور طراحی استوری‌های صنعتی - ماشین دیزاین</title>
  <link rel="stylesheet" href="story_styles.css">
</head>
<body>

  <!-- کتابخانه SVG برداری مهندسی -->
  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <!-- بلوک ایزومتریک شیاردار -->
      <g id="iso-cube" stroke="#6cc618" stroke-width="2.1" fill="#060606">
        <polygon points="0,-38 -32.9,-19 -32.9,19 0,38" />
        <line x1="-6.58" y1="-34.2" x2="-6.58" y2="34.2" />
        <line x1="-13.16" y1="-30.4" x2="-13.16" y2="30.4" />
        <line x1="-19.74" y1="-26.6" x2="-19.74" y2="26.6" />
        <line x1="-26.32" y1="-22.8" x2="-26.32" y2="22.8" />

        <polygon points="0,-38 32.9,-19 32.9,19 0,0" />
        <line x1="0" y1="-30.4" x2="32.9" y2="-11.4" />
        <line x1="0" y1="-22.8" x2="32.9" y2="-3.8" />
        <line x1="0" y1="-15.2" x2="32.9" y2="3.8" />
        <line x1="0" y1="-7.6" x2="32.9" y2="11.4" />

        <polygon points="0,0 32.9,-19 32.9,19 0,38" />
        <line x1="0" y1="7.6" x2="32.9" y2="-11.4" />
        <line x1="0" y1="15.2" x2="32.9" y2="-3.8" />
        <line x1="0" y1="22.8" x2="32.9" y2="3.8" />
        <line x1="0" y1="30.4" x2="32.9" y2="11.4" />
      </g>

      <!-- چرخ‌دنده ۱۶ دندانه دقیق -->
      <path id="gear-vec" fill-rule="evenodd" clip-rule="evenodd" d="
        M44 6 H56 L58 17.5 A34 34 0 0 1 65.5 20.6 L75.5 13.5 L84 22 L76.9 32 A34 34 0 0 1 80 39.5 L91.5 41.5 V53.5 L80 55.5 A34 34 0 0 1 76.9 63 L84 73 L75.5 81.5 L65.5 74.4 A34 34 0 0 1 58 77.5 L56 89 H44 L42 77.5 A34 34 0 0 1 34.5 74.4 L24.5 81.5 L16 73 L23.1 63 A34 34 0 0 1 20 55.5 L8.5 53.5 V41.5 L20 39.5 A34 34 0 0 1 23.1 32 L16 22 L24.5 13.5 L34.5 20.6 A34 34 0 0 1 42 17.5 Z
        M50 67 A19.5 19.5 0 1 0 50 28 A19.5 19.5 0 1 0 50 67 Z" />
    </defs>
  </svg>

  <!-- نوار ابزار بالا -->
  <div class="top-toolbar">
    <div class="toolbar-brand">
      <svg width="22" height="22" viewBox="0 0 100 100"><use href="#gear-vec" fill="var(--neon-green)"/></svg>
      MACHINEDESIGN // STORY ENGINE
    </div>
    <div class="toolbar-actions">
      <button class="btn-tool active" onclick="openJsonModal()">ویرایش داده‌ها (JSON)</button>
      <button class="btn-tool" onclick="window.print()">چاپ / ذخیره PDF</button>
    </div>
  </div>

  <header class="showcase-header">
    <h1>موتور طراحی استوری‌های مهندسی <span>ماشین دیزاین</span></h1>
    <p>معماری عمودی ۹:۱۶ (۱۰۸۰×۱۹۲۰) — تایپوگرافی فارسی، وکتورهای ریاضی و انیمیشن زنده</p>
  </header>

  <!-- بورد نمایش استوری‌ها -->
  <main class="story-deck" id="storyDeck">
    <!-- توسط داده‌های JSON پر می‌شود -->
  </main>

  <!-- مدال ویرایشگر زنده JSON -->
  <div class="modal-overlay" id="jsonModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>ویرایشگر زنده داده‌های استوری (JSON)</h3>
        <button class="modal-close" onclick="closeJsonModal()">&times;</button>
      </div>
      <textarea class="modal-textarea" id="jsonInput"></textarea>
      <div class="modal-actions">
        <button class="btn-tool" onclick="resetDefaultData()">بازنشانی پیش‌فرض</button>
        <button class="btn-tool active" onclick="applyJsonData()">اعمال و رندر مجدد</button>
      </div>
    </div>
  </div>

  <script>
    let storyMaster = null;

    async function initStories() {
      try {
        const res = await fetch('story_data.json');
        if (res.ok) {
          storyMaster = await res.json();
        }
      } catch (err) {
        console.warn('Fetch fallback to embedded data:', err);
      }

      if (!storyMaster) {
        storyMaster = {
          "brand": {
            "name_fa": "ماشین دیزاین",
            "name_en_prefix": "Machine",
            "name_en_suffix": "Design",
            "handle": "@machinedesign.ir",
            "website": "machinedesign.ir"
          },
          "stories": [
            {
              "id": 1,
              "tag": "توقف خط تولید",
              "headline_prefix": "هزینه توقف هر ساعت خطت",
              "headline_bold": "چند ده میلیون تومنه؟",
              "description": "۸۰٪ توقف‌های پیش‌بینی‌نشده در کارخانه‌ها ناشی از طراحی ضعیف مکانیزم‌ها، لقی تلرانسی و انتخاب نامناسب متریال است. ما قبل از خرابی، مسئله را در ریشه حل می‌کنیم.",
              "image": "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&q=80",
              "swipe_hint": "برای راهکار ورق بزنید"
            },
            {
              "id": 2,
              "tag": "مهندسی معکوس و متالورژی",
              "title": "آناتومی هیدروبیرینگ صنعتی",
              "image": "https://images.unsplash.com/photo-1537462715879-360eeb61a0ad?auto=format&fit=crop&w=800&q=80",
              "callouts": {
                "tl": { "val": "±0.005 mm", "lbl": "تلرانس هندسی GD&T" },
                "tr": { "val": "DIN 1.7225", "lbl": "فولاد آلیاژی MO40" },
                "bl": { "val": "62 HRC", "lbl": "سختی‌کاری القایی" },
                "br": { "val": "Zero Backlash", "lbl": "لقی صفر زاویه‌ای" }
              },
              "specs": [
                { "title": "تحلیل شبیه‌سازی FEA", "desc": "توزیع تنش و حرارت در ۳۵,۰۰۰ دور در دقیقه بدون افت ویسکوزیته." },
                { "title": "بومی‌سازی قطعات خاص", "desc": "طراحی برای ساخت دقیق (DFMA) با کاهش ۴۰ درصدی هزینه‌های واردات." }
              ]
            },
            {
              "id": 3,
              "tag": "پروژه میدانی کارخانه‌ای",
              "title": "بهینه‌سازی خط بسته‌بندی پیوسته",
              "image": "https://images.unsplash.com/photo-1565043589221-1a6fd9ae45c7?auto=format&fit=crop&w=800&q=80",
              "metrics": [
                { "val": "۲.۸ برابر", "lbl": "افزایش سرعت خروجی" },
                { "val": "۳۵٪-", "lbl": "کاهش ضایعات محصول" }
              ],
              "body": "در کارخانه صنایع غذایی، با اصلاح مکانیزم کانوایر و تعویض گیربکس‌های سنگین با هارمونیک درایو بدون لقی، راندمان خط بسته‌بندی در شیفت شب به ۹۸.۴٪ رسید.",
              "client": "صنایع بسته‌بندی و غذایی البرز"
            },
            {
              "id": 4,
              "tag": "کوییز تخصصی مهندسی",
              "question": "علت اصلی ارتعاش یاتاقان در سرعت‌های بحرانی چیه؟",
              "options": [
                { "text": "عدم بالانس استاتیکی و دینامیکی شفت", "votes": "۶۴٪", "is_correct": true },
                { "text": "سفتی بیش از حد پیچ‌های نشیمنگاه", "votes": "۱۸٪", "is_correct": false },
                { "text": "افزایش ویسکوزیته روغن روانکار", "votes": "۱۸٪", "is_correct": false }
              ],
              "note": "تحلیل ارتعاشات ارتعاش‌سنجی خط قبل از شکست یاتاقان تا ۳۰۰ میلیون تومان از تحمیل خسارت جلوگیری می‌کنه."
            },
            {
              "id": 5,
              "tag": "مشاوره اختصاصی",
              "title": "رفع دائمی توقف خط و بهینه‌سازی ماشین‌آلات",
              "image": "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=800&q=80",
              "bullet_points": [
                "کارشناسی فنی خرید ماشین‌آلات صنعتی (چین / اروپا)",
                "طراحی خطوط تولید و کانوایرهای تخصصی",
                "مشاوره سازمانی R&D و ساخت نمونه اولیه (پروتوتایپ)"
              ],
              "button_text": "ارسال کلمه «مشاوره» در دایرکت",
              "website_label": "machinedesign.ir"
            }
          ]
        };
      }

      renderStories();
    }

    function renderStories() {
      const deck = document.getElementById('storyDeck');
      const b = storyMaster.brand;
      const brandHtml = `<strong>${b.name_en_prefix}</strong>${b.name_en_suffix}`;

      let html = '';

      storyMaster.stories.forEach(s => {
        if (s.id === 1) {
          html += `
          <article class="story-card bg-tech-grid" id="story-1">
            <div class="story-header">
              <span class="story-tag-badge">${s.tag}</span>
              <div class="story-brand-pill">
                <span>${b.name_fa}</span>
                <svg width="14" height="14" viewBox="0 0 100 100" class="anim-gear-spin"><use href="#gear-vec" fill="var(--neon-green)"/></svg>
              </div>
            </div>

            <div class="s1-content">
              <div class="s1-headline">
                <h2>
                  ${s.headline_prefix}
                  <span>${s.headline_bold}</span>
                </h2>
              </div>

              <div class="s1-hex-frame">
                <div class="s1-hex-inner">
                  <img class="slot-img" src="${s.image}" alt="Emergency">
                </div>
              </div>

              <div class="s1-desc-box">
                <p>${s.description}</p>
              </div>

              <div class="s1-swipe-hint">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>${s.swipe_hint}</span>
              </div>
            </div>

            <div class="story-footer">
              <span>ماشین دیزاین // عیب‌یابی خط</span>
              <span class="web-tag">${b.website}</span>
            </div>

            <!-- وکتور ایزومتریک گوشه چپ -->
            <svg style="position:absolute; bottom:0; left:0; width:130px; height:180px; opacity:0.16; pointer-events:none;" viewBox="0 0 150 200">
              <use href="#iso-cube" x="30" y="40" /><use href="#iso-cube" x="30" y="116" />
              <use href="#iso-cube" x="63" y="78" /><use href="#iso-cube" x="63" y="154" />
            </svg>
          </article>`;
        } else if (s.id === 2) {
          const specsHtml = s.specs.map(sp => `
            <div class="s2-spec-box">
              <h5>${sp.title}</h5>
              <p>${sp.desc}</p>
            </div>
          `).join('');

          html += `
          <article class="story-card bg-tech-grid" id="story-2">
            <div class="story-header">
              <span class="story-tag-badge">${s.tag}</span>
              <div class="story-brand-pill">
                <span>${b.name_fa}</span>
                <svg width="14" height="14" viewBox="0 0 100 100" class="anim-gear-spin"><use href="#gear-vec" fill="var(--neon-green)"/></svg>
              </div>
            </div>

            <div class="s2-content">
              <div class="s2-title-row">
                <h3>${s.title}</h3>
              </div>

              <div class="s2-oct-wrap">
                <div class="s2-callout c-tl"><strong>${s.callouts.tl.val}</strong>${s.callouts.tl.lbl}</div>
                <div class="s2-callout c-tr"><strong>${s.callouts.tr.val}</strong>${s.callouts.tr.lbl}</div>

                <div class="s2-oct-outer">
                  <div class="s2-oct-inner">
                    <img class="slot-img" src="${s.image}" alt="Component">
                  </div>
                </div>

                <div class="s2-callout c-bl"><strong>${s.callouts.bl.val}</strong>${s.callouts.bl.lbl}</div>
                <div class="s2-callout c-br"><strong>${s.callouts.br.val}</strong>${s.callouts.br.lbl}</div>
              </div>

              <div class="s2-specs-grid">
                ${specsHtml}
              </div>
            </div>

            <div class="story-footer">
              <span>استاندارد تلرانس ISO 1101</span>
              <span class="web-tag">${b.website}</span>
            </div>
          </article>`;
        } else if (s.id === 3) {
          const metricsHtml = s.metrics.map(m => `
            <div class="s3-metric-cell">
              <div class="s3-metric-val">${m.val}</div>
              <div class="s3-metric-lbl">${m.lbl}</div>
            </div>
          `).join('');

          html += `
          <article class="story-card" id="story-3">
            <div class="s3-bg-wrap">
              <img class="slot-img" src="${s.image}" alt="Plant Case Study">
            </div>

            <div class="story-header">
              <span class="story-tag-badge">${s.tag}</span>
              <div class="story-brand-pill" style="background:rgba(0,0,0,0.85);">
                <span>${b.name_fa}</span>
                <svg width="14" height="14" viewBox="0 0 100 100"><use href="#gear-vec" fill="var(--neon-green)"/></svg>
              </div>
            </div>

            <div class="s3-content">
              <div class="s3-glass-card">
                <h3 style="font-size:17px; font-weight:800; color:#fff; margin-bottom:10px;">${s.title}</h3>
                <div class="s3-metrics-row">${metricsHtml}</div>
                <p class="s3-body-text">${s.body}</p>
                <div style="margin-top:10px; font-size:10.5px; color:var(--neon-green);">
                  مشتری: <strong>${s.client}</strong>
                </div>
              </div>
            </div>

            <div class="story-footer" style="background:rgba(0,0,0,0.85);">
              <span>پروژه‌های اجرایی ماشین دیزاین</span>
              <span class="web-tag">${b.website}</span>
            </div>
          </article>`;
        } else if (s.id === 4) {
          const optsHtml = s.options.map(op => `
            <div class="s4-option-btn ${op.is_correct ? 'correct' : ''}">
              <span>${op.text}</span>
              <span class="vote-perc">${op.votes}</span>
            </div>
          `).join('');

          html += `
          <article class="story-card bg-tech-grid" id="story-4">
            <div class="story-header">
              <span class="story-tag-badge">${s.tag}</span>
              <div class="story-brand-pill">
                <span>${b.name_fa}</span>
                <svg width="14" height="14" viewBox="0 0 100 100"><use href="#gear-vec" fill="var(--neon-green)"/></svg>
              </div>
            </div>

            <div class="s4-content">
              <div class="s4-question-box">
                <div style="font-size:11px; color:var(--neon-green); font-weight:700; margin-bottom:4px;">کوییز فنی // مهندسی مکانیک</div>
                <h3>${s.question}</h3>
              </div>

              <div class="s4-options-list">
                ${optsHtml}
              </div>

              <div class="s4-note-card">
                <strong style="color:var(--neon-green); display:block; margin-bottom:3px;">نکته مهندسی:</strong>
                ${s.note}
              </div>
            </div>

            <div class="story-footer">
              <span>آموزش و منتورشیپ صنعتی</span>
              <span class="web-tag">${b.website}</span>
            </div>
          </article>`;
        } else if (s.id === 5) {
          const bulletsHtml = s.bullet_points.map(bp => `
            <div class="s5-bullet-item">${bp}</div>
          `).join('');

          html += `
          <article class="story-card bg-tech-grid" id="story-5">
            <div class="s5-top-photo">
              <img class="slot-img" src="${s.image}" alt="Machinery CTA">
              <div class="story-header" style="position:absolute; top:0; left:0; right:0; padding:16px 20px;">
                <span class="story-tag-badge">${s.tag}</span>
                <div class="story-brand-pill" style="background:rgba(0,0,0,0.85);">
                  <span>${b.name_fa}</span>
                  <svg width="14" height="14" viewBox="0 0 100 100"><use href="#gear-vec" fill="var(--neon-green)"/></svg>
                </div>
              </div>
            </div>

            <div class="s5-content">
              <div class="s5-headline">
                <h3>${s.title}</h3>
              </div>

              <div class="s5-bullets">
                ${bulletsHtml}
              </div>

              <div class="s5-cta-button">
                <span>${s.button_text}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </div>
            </div>

            <div class="story-footer">
              <span>${b.handle}</span>
              <span class="web-tag">${s.website_label}</span>
            </div>
          </article>`;
        }
      });

      deck.innerHTML = html;
    }

    function openJsonModal() {
      document.getElementById('jsonInput').value = JSON.stringify(storyMaster, null, 2);
      document.getElementById('jsonModal').classList.add('open');
    }

    function closeJsonModal() {
      document.getElementById('jsonModal').classList.remove('open');
    }

    function applyJsonData() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonInput').value);
        storyMaster = parsed;
        renderStories();
        closeJsonModal();
      } catch (err) {
        alert('خطای ساختار JSON: ' + err.message);
      }
    }

    function resetDefaultData() {
      initStories();
      closeJsonModal();
    }

    window.addEventListener('DOMContentLoaded', initStories);
  </script>
</body>
</html>
